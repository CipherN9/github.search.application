services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: [ "redis-server", "--requirepass", "$REDIS_PASSWORD" ]
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: on-failure
    networks:
      - backend
    volumes:
      - .:/app

networks:
  backend:
    driver: bridge
